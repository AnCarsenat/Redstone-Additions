# Publishes a release to Modrinth: the data pack zip, and the same pack as a
# Fabric / Quilt / Forge / NeoForge jar (the "+mod" version).
#
# Built from the Kotlin sources in redstone_additions/ with Kore (JDK 25).
# Triggered by pushing a tag like "v6.2.0", or manually from the Actions tab. The tag
# must equal `version` in redstone_additions/gradle.properties.
# Needs a MODRINTH_TOKEN repository secret with the "Create versions" scope. The
# Modrinth project (52z5jQjy) already exists; this only adds versions to it.

name: Publish to Modrinth

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every Minecraft version the pack supports, as Modrinth names them. The Kore build
  # targets exactly the version Kore targets (gradle/libs.versions.toml: kore = "x-26.3"),
  # and pack.mcmeta declares only that format.
  GAME_VERSIONS: "26.3"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading "v"'
        required: true

permissions:
  contents: read

concurrency:
  group: modrinth-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # A tag push carries the version in the ref, a manual run in the input.
      # Both go through the environment rather than being interpolated into the
      # script, so the value cannot break out into the shell.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#v}"
          case "$version" in
            '' | *[!0-9a-zA-Z.-]* )
              echo "::error::refusing to publish version '$version'; expected only letters, digits, dots and hyphens" >&2
              exit 1 ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The tag and the version the pack is built with must agree: the pack.mcmeta
      # description and the load message both carry it, and the publish script checks
      # pack.mcmeta again before uploading anything.
      - name: Check version matches gradle.properties
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          declared="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' redstone_additions/gradle.properties | head -n1)"
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::publishing $VERSION, but redstone_additions/gradle.properties says version=$declared" >&2
            exit 1
          fi

      # Strict by default: generation fails on a call to a function the pack never defines.
      - name: Build with Kore
        working-directory: redstone_additions
        run: ./gradlew koreBuild --no-daemon

      - name: Publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 .github/scripts/modrinth_publish.py "$VERSION" --out dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: redstone-additions-${{ steps.version.outputs.value }}
          path: dist/
